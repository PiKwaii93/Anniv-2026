[functions.spotify-jukebox]
verify_jwt = true
entrypoint = "./functions/spotify-jukebox/index.ts"

[functions.push-subscription]
enabled = true
verify_jwt = false
import_map = "./functions/push-subscription/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/push-subscription/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/push-subscription/*.html" ]

[functions.push-test]
enabled = true
# The gateway's legacy JWT verifier rejects current publishable-key/Auth
# combinations. Authentication remains mandatory inside the function through
# withSupabase({ auth: 'user' }) followed by the app_admins membership check.
verify_jwt = false
import_map = "./functions/push-test/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/push-test/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/push-test/*.html" ]
